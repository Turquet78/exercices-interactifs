# Rejoue le banc de contrôles sur chaque pull request et chaque poussée sur main.
# La fusion vers main (= mise en ligne, GitHub Pages) exige que ce contrôle soit vert.
# Les TROIS niveaux sont contrôlés. Chacun a son étape, pour que l'action nomme
# le fichier fautif ; « if: always() » fait tourner les trois même si le premier
# échoue, sinon un niveau cassé masquerait l'état des deux autres.
name: Contrôles

on:
  pull_request:
  push:
    branches: [main]

jobs:
  controles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: premiere-specifique.html
        run: npm run test:premiere
      - name: secondes.html
        if: always()
        run: npm run test:secondes
      - name: terminale.html
        if: always()
        run: npm run test:terminale
