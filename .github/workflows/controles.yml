# Rejoue le banc de contrôles sur chaque pull request et chaque poussée sur main.
# La fusion vers main (= mise en ligne, GitHub Pages) exige que ces contrôles soient verts.
#
# Deux travaux séparés, volontairement :
#   « controles »  — rapide, sans navigateur : structure, démarrage, exercices (jsdom).
#   « navigateur » — ouvre un vrai Chromium et fait un exercice de bout en bout.
# Les séparer garde le verdict structurel rapide, et évite qu'une panne
# d'installation de navigateur masque l'état réel du code.
name: Contrôles

# Les contrôles ne font que lire le dépôt et lancer des bancs : le jeton n'a
# besoin de rien d'autre. Le déclarer évite d'hériter des droits par défaut,
# qui peuvent aller jusqu'à l'écriture.
permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  controles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      # Chaque niveau a son étape, pour que l'action nomme le fichier fautif ;
      # « if: always() » les fait toutes tourner, sinon un niveau cassé masquerait
      # l'état des deux autres.
      - name: premiere-specifique.html
        run: npm run test:premiere
      - name: secondes.html
        if: always()
        run: npm run test:secondes
      - name: terminale.html
        if: always()
        run: npm run test:terminale

  # Les deux autres travaux remplacent Supabase par un double en mémoire — exprès,
  # pour qu'aucun contrôle n'approche les comptes réels. Ils sont donc aveugles
  # aux règles d'accès de la base, et c'est précisément là qu'étaient les fuites.
  # Celui-ci lève un PostgreSQL jetable, y rejoue la vraie migration et vérifie
  # ce que chaque rôle obtient. Il ne touche jamais au projet Supabase.
  base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # L'image ubuntu-latest embarque PostgreSQL, mais le service est arrêté :
      # le banc n'en veut pas, il monte son propre serveur sur un port à lui.
      - name: Règles d'accès de la base
        run: npm run test:base

  # La fonction Edge tourne chez Deno, hors de portée des trois autres bancs :
  # le double du banc navigateur ne l'appelle jamais, et le banc de base ne
  # connaît que PostgreSQL. Elle n'était donc vérifiée que par la relecture, et
  # un défaut bloquant y est passé — « Nouveau code » refusait tous les élèves
  # inscrits avant la bascule. Ce banc la charge dans Node et l'exécute.
  fonction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fonction Edge admin-eleve
        run: npm run test:fonction

  # LES TROIS NIVEAUX EN PARALLÈLE, une machine chacun. Ils tournaient l'un
  # après l'autre dans un seul travail : environ trois minutes par niveau, plus
  # l'installation de Chromium, soit une dizaine de minutes avant de pouvoir
  # fusionner — et c'est ce banc-là qui décide de la mise en ligne. Les trois
  # niveaux sont indépendants : chacun ouvre son propre fichier, dans son propre
  # navigateur, et ne partage rien avec les autres. Les séparer ne retire donc
  # aucun contrôle ; ça remplace une attente de dix minutes par une de trois.
  #
  # « fail-fast: false » est indispensable : sans lui, un niveau rouge annulerait
  # les deux autres en cours de route, et on ne saurait pas si le défaut touche
  # un fichier ou les trois. C'est ce que faisait déjà « if: always() » dans la
  # version en série, et pour la même raison.
  #
  # Le nom du travail porte le niveau (« navigateur (secondes.html) ») : c'est
  # lui qui s'affiche sur la pull request, et il doit dire quel fichier a rougi
  # sans qu'on ait à ouvrir les traces.
  navigateur:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        niveau: [premiere-specifique.html, secondes.html, terminale.html]
    name: navigateur (${{ matrix.niveau }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Installer Chromium
        run: npx playwright install --with-deps chromium
      - name: ${{ matrix.niveau }} — dans un vrai navigateur
        run: node tests/navigateur.js ${{ matrix.niveau }}
